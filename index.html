<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>贪吃蛇 — 圆珠流畅版</title>
<style>
  :root{--bg1:#071423;--panel:#081827;--accent:#40f08a;--muted:#9fb0bf}
  html,body{height:100%;margin:0;font-family:system-ui,Arial;background:linear-gradient(180deg,#051017,#07232b);color:#e6eef8}
  .wrap{max-width:980px;margin:28px auto;padding:18px;background:rgba(255,255,255,0.03);border-radius:12px;display:grid;grid-template-columns:620px 300px;gap:18px;align-items:start}
  canvas{width:100%;height:auto;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.06));display:block}
  .panel{padding:8px}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .score{font-weight:700;color:var(--accent);font-size:18px}
  .info{color:var(--muted);font-size:13px}
  button,select{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);color:inherit;padding:8px;border-radius:8px;cursor:pointer}
  .controls{display:flex;gap:8px;align-items:center;margin-top:10px}
  .touchpad{display:grid;grid-template-columns:56px 56px 56px;gap:8px;justify-content:center;margin-top:12px}
  .tp{width:56px;height:56px;border-radius:10px;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;font-weight:700;user-select:none}
  h3{margin:8px 0 6px 0}
  ol{color:var(--muted);padding-left:18px}
  footer{grid-column:1/-1;text-align:center;color:var(--muted);margin-top:8px;font-size:12px}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}canvas{height:360px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="hud">
      <div><div class="score">分数: <span id="score">0</span></div><div class="info">速度: <span id="speedLabel">中等</span></div></div>
      <div class="info">方向键 / WASD / 屏幕按钮 控制</div>
    </div>
    <canvas id="game" width="620" height="620"></canvas>

    <div class="controls">
      <button id="startBtn">开始</button>
      <button id="pauseBtn">暂停</button>
      <button id="restartBtn">重置</button>
      <label style="margin-left:auto" class="info">速度
        <select id="speed">
          <option value="160">慢</option>
          <option value="110" selected>中等</option>
          <option value="70">快</option>
          <option value="45">极速</option>
        </select>
      </label>
    </div>

    <div class="touchpad" aria-hidden="true">
      <div></div>
      <div class="tp" data-dir="up">↑</div>
      <div></div>
      <div class="tp" data-dir="left">←</div>
      <div class="tp" data-dir="down">↓</div>
      <div class="tp" data-dir="right">→</div>
    </div>
  </div>

  <div class="panel">
    <h3>排行榜（本地 Top 10）</h3>
    <ol id="leaderboard"></ol>
    <h3>说明</h3>
    <ol>
      <li>每吃一颗食物 +10 分。</li>
      <li>触碰边界或自身游戏结束，分数会自动保存到本地排名。</li>
      <li>该版本用 rAF + 时间步进，动画更平滑。</li>
    </ol>
    <h3>调试 / 快捷</h3>
    <div class="info">窗口缩放或在移动端使用触控方向键体验更好。</div>
  </div>

  <footer>原创 — 圆珠流畅版 · 单文件</footer>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // logical grid
  const GRID = 20;
  const COLS = Math.floor(canvas.width / GRID);
  const ROWS = Math.floor(canvas.height / GRID);

  // game state
  let snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
  let dir = {x:0,y:0}, nextDir = {x:0,y:0};
  let food = null;
  let score = 0;
  let lastTime = 0;
  let accumulator = 0; // ms accumulator to step game at fixed interval
  let stepMS = 110; // default
  let running = false;

  // DOM
  const scoreEl = document.getElementById('score');
  const speedSelect = document.getElementById('speed');
  const speedLabel = document.getElementById('speedLabel');
  const leaderboardEl = document.getElementById('leaderboard');

  // audio (tiny base64 placeholders for compatibility; browsers may block autoplay until interaction)
  const eatSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=");
  const deadSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=");

  // Helper: place food not on snake
  function randPos(){
    return {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  }
  function placeFood(){
    let p;
    let tries = 0;
    do {
      p = randPos();
      tries++;
      if (tries>500) break;
    } while (snake.some(s => s.x===p.x && s.y===p.y));
    food = p;
    // give food a spawn time for pulsing animation
    food._spawn = performance.now();
  }

  function resetGame(){
    snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
    dir = {x:0,y:0}; nextDir = {x:0,y:0};
    score = 0; scoreEl.textContent = score;
    placeFood();
    running = false;
  }

  function setSpeed(ms){
    stepMS = ms;
    if(ms>=130) speedLabel.textContent = '慢';
    else if(ms>=90) speedLabel.textContent = '中等';
    else if(ms>=60) speedLabel.textContent = '快';
    else speedLabel.textContent = '极速';
  }
  setSpeed(stepMS);

  // Leaderboard (localStorage)
  function loadScores(){
    try{
      return JSON.parse(localStorage.getItem('snake_scores_v2') || '[]');
    }catch(e){ return []; }
  }
  function saveScore(s){
    const list = loadScores();
    list.push({score: s, date: new Date().toISOString()});
    list.sort((a,b)=> b.score - a.score);
    localStorage.setItem('snake_scores_v2', JSON.stringify(list.slice(0,10)));
  }
  function drawLeaderboard(){
    const list = loadScores();
    leaderboardEl.innerHTML = '';
    if(list.length===0){ leaderboardEl.innerHTML = '<li style="color:#96a7b7">暂无记录</li>'; return; }
    list.forEach((it, i) => {
      const li = document.createElement('li');
      li.textContent = `${i+1}. ${it.score} 分 (${(new Date(it.date)).toLocaleDateString()})`;
      leaderboardEl.appendChild(li);
    });
  }

  // Input handling
  const keyMap = {
    ArrowUp: {x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0}
  };
  window.addEventListener('keydown', e => {
    const m = keyMap[e.key];
    if(m){ nextDir = m; // start on first input
      if(!running) startGame();
      e.preventDefault();
    }
  });

  // touch buttons
  document.querySelectorAll('.tp').forEach(btn => {
    btn.addEventListener('touchstart', (ev)=>{ ev.preventDefault(); const d = btn.dataset.dir; setDirByName(d); });
    btn.addEventListener('mousedown', ()=>{ const d = btn.dataset.dir; setDirByName(d); });
  });

  function setDirByName(name){
    const map = {up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    if(map[name]) nextDir = map[name];
    if(!running) startGame();
  }

  // Game step: update snake position once
  function step(){
    // apply buffered direction, prevent direct reverse
    if(!(nextDir.x===-dir.x && nextDir.y===-dir.y)){
      if(!(nextDir.x===0 && nextDir.y===0)) dir = {...nextDir};
    }
    // if still stationary, do nothing
    if(dir.x===0 && dir.y===0) return true;

    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // check wall collision
    if(head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS){
      return false; // dead
    }
    // self collision
    if(snake.some(s => s.x===head.x && s.y===head.y)){
      return false;
    }

    snake.unshift(head);

    // eat food?
    if(food && head.x===food.x && head.y===food.y){
      score += 10;
      scoreEl.textContent = score;
      try{ eatSound.currentTime = 0; eatSound.play().catch(()=>{}); }catch(e){}
      placeFood();
    } else {
      snake.pop();
    }
    return true;
  }

  // Rendering: optimized drawing
  function draw(now){
    // draw background with subtle grid using fillRect (faster than clearRect per small canvas)
    ctx.save();
    ctx.fillStyle = 'rgba(3,8,12,0.6)';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // draw pulsing food
    if(food){
      const t = (performance.now() - (food._spawn||0)) / 500; // cycles
      const pulse = 1 + Math.sin(t*2*Math.PI) * 0.14; // scale
      const cx = food.x * GRID + GRID/2;
      const cy = food.y * GRID + GRID/2;
      const r = (GRID*0.45) * pulse;
      ctx.beginPath();
      const col = foodColor(food.x, food.y);
      ctx.fillStyle = col;
      ctx.shadowColor = col;
      ctx.shadowBlur = 12 * (pulse-1 + 0.5);
      ctx.arc(cx, cy, r, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // draw snake as beads with gradient along body
    for(let i=snake.length-1;i>=0;i--){
      const p = snake[i];
      const cx = p.x * GRID + GRID/2;
      const cy = p.y * GRID + GRID/2;
      const t = i / Math.max(1, snake.length-1);
      // hue from head (green) to tail (blueish/purple)
      const hue = (140 - t*80); // 140 -> 60
      const sat = 70 + t*10;
      const light = 50 - t*10;
      const color = `hsl(${hue} ${sat}% ${light}%)`;
      // slightly larger head
      const beadSize = i===0 ? GRID*0.52 : GRID*0.42;
      ctx.beginPath();
      // shadow for glow
      ctx.fillStyle = color;
      ctx.shadowBlur = i===0 ? 10 : 6;
      ctx.shadowColor = color;
      ctx.arc(cx, cy, beadSize, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
      // head eyes
      if(i===0){
        const eyeOffset = Math.max(3, GRID*0.12);
        const ex = cx + (dir.x * eyeOffset) - (dir.y * 2);
        const ey = cy + (dir.y * eyeOffset) + (dir.x * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.95)';
        ctx.beginPath(); ctx.arc(ex-4, ey-4, Math.max(1.6, GRID*0.04), 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex+4, ey-4, Math.max(1.6, GRID*0.04), 0, Math.PI*2); ctx.fill();
      }
    }

    ctx.restore();
  }

  function foodColor(x,y){
    const colors = ['#ff6b6b','#ffd93d','#4dd0e1','#7b61ff','#ff7ab6'];
    return colors[(x+y) % colors.length];
  }

  // Main loop: rAF with accumulator to step at fixed intervals (stepMS)
  function loop(now){
    if(!lastTime) lastTime = now;
    const delta = now - lastTime;
    lastTime = now;
    accumulator += delta;
    // Process as many steps as needed (prevents slow frames from skipping correctly)
    let alive = true;
    while(accumulator >= stepMS){
      alive = step();
      accumulator -= stepMS;
    }
    // render every frame
    draw(now);
    if(alive){
      rafId = requestAnimationFrame(loop);
    } else {
      // dead
      running = false;
      try{ deadSound.currentTime = 0; deadSound.play().catch(()=>{}); }catch(e){}
      saveScore(score);
      drawLeaderboard();
      // show overlay text
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, canvas.height/2 - 30, canvas.width, 80);
      ctx.fillStyle = '#fff';
      ctx.font = '22px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText('游戏结束 — 分数: ' + score, canvas.width/2, canvas.height/2 + 6);
      ctx.restore();
    }
  }

  let rafId = null;
  function startGame(){
    if(running) return;
    running = true;
    lastTime = 0;
    accumulator = 0;
    rafId = requestAnimationFrame(loop);
  }
  function stopGame(){
    running = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
  }

  // UI events
  document.getElementById('startBtn').addEventListener('click', ()=> startGame());
  document.getElementById('pauseBtn').addEventListener('click', ()=> stopGame());
  document.getElementById('restartBtn').addEventListener('click', ()=> { resetGame(); startGame(); });
  speedSelect.addEventListener('change', ()=> { setSpeed(parseInt(speedSelect.value,10)); });

  // initial setup
  setSpeed(parseInt(speedSelect.value,10));
  resetGame();
  drawLeaderboard();

  // expose for console testing
  window.__snake_smooth = { reset: resetGame, start: startGame, stop: stopGame };

  // make canvas scale crisp on high DPI
  (function adaptDPI(){
    const ratio = window.devicePixelRatio || 1;
    if(ratio === 1) return;
    const w = canvas.width, h = canvas.height;
    canvas.width = w * ratio;
    canvas.height = h * ratio;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(ratio,0,0,ratio,0,0);
  })();

})();
</script>
</body>
</html>
